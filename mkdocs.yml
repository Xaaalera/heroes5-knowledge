site_name: База знаний Xaaalera о Героях
site_description: Личные заметки, исследования и руководства по Heroes V.
site_url: https://xaaalera.github.io/heroes5-knowledge/
repo_url: https://github.com/Xaaalera/heroes5-knowledge
edit_uri: edit/main/docs/
theme:
  name: null
  custom_dir: theme
  static_templates:
  - 404.html
plugins:
- search:
    lang:
    - ru
    - en
markdown_extensions:
- admonition
- attr_list
- fenced_code
- tables
- toc:
    permalink: false
nav:
- Главная: index.md
- Игрокам:
  - Расстановка в игре: players/army-placement.md
  - Проекции и карточки: players/deployment-preview.md
- Моддерам:
  - Стенд разработки: modding/devkit.md
  - Ресурсный override: modding/resource-overrides.md
  - Боевые скрипты: modding/combat-scripts.md
  - Тестовые карты: modding/test-maps.md
  - Нативные окна: modding/native-ui.md
  - Публичные данные: modding/public-information.md
- Справочник:
  - Карта знаний: reference/research-index.md
  - Дневник исследований: reference/research-diary.md
  - Сборка Universe: reference/universe-build.md
  - Архивы и кодировки: reference/formats.md
  - Существа и грейды: reference/creatures.md
  - Хранилища: reference/banks.md
  - 'Расстановка: детали': reference/placement-internals.md
- О базе: about/index.md
- Предложить правку: contributing.md
- English:
  - Home: en/index.md
  - Players:
    - Game placement: en/players/army-placement.md
    - Projections and cards: en/players/deployment-preview.md
  - Mod creators:
    - Development environment: en/modding/devkit.md
    - Resource override: en/modding/resource-overrides.md
    - Combat scripts: en/modding/combat-scripts.md
    - Test maps: en/modding/test-maps.md
    - Native UI: en/modding/native-ui.md
    - Public inputs: en/modding/public-information.md
  - Reference:
    - Knowledge map: en/reference/research-index.md
    - Research diary: en/reference/research-diary.md
    - Universe build: en/reference/universe-build.md
    - Archives and encodings: en/reference/formats.md
    - Creature definitions: en/reference/creatures.md
    - Banks: en/reference/banks.md
    - Placement internals: en/reference/placement-internals.md
  - About: en/about/index.md
  - Contributing: en/contributing.md
