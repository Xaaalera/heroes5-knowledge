site_name: База знаний Xaaalera о Героях
site_description: Личные заметки, исследования и руководства по Heroes V.
site_url: https://xaaalera.github.io/heroes5-knowledge/
repo_url: https://github.com/Xaaalera/heroes5-knowledge
edit_uri: edit/main/docs/
theme:
  name: null
  custom_dir: theme
  static_templates:
  - 404.html
plugins:
- search:
    lang:
    - ru
    - en
markdown_extensions:
- admonition
- attr_list
- fenced_code
- tables
- toc:
    permalink: false
nav:
- Главная: index.md
- Игрокам:
  - С чего начать: players/getting-started.md
  - Установка модов: players/installing-mods.md
  - Как игра расставляет армию: players/army-placement.md
- Моддерам:
  - Первый эксперимент: modding/getting-started.md
  - Проверка изменений: modding/verification.md
- Справочник:
  - Форматы файлов: reference/formats.md
- О базе: about/index.md
- Предложить правку: contributing.md
- English:
  - Home: en/index.md
  - Players:
    - Getting started: en/players/getting-started.md
    - Installing mods: en/players/installing-mods.md
    - How the game deploys armies: en/players/army-placement.md
  - Mod creators:
    - First experiment: en/modding/getting-started.md
    - Verification: en/modding/verification.md
  - File formats: en/reference/formats.md
  - About: en/about/index.md
  - Contributing: en/contributing.md
